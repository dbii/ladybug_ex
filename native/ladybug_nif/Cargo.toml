[package]
name = "ladybug_nif"
version = "0.1.0"
edition = "2021"
authors = []

[lib]
name = "ladybug_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.35.0"
# Pinned EXACTLY. The engine is compiled from the source bundled in this crate
# (see .cargo/config.toml), so the engine version equals the crate version.
# Extensions are built per *minor*: the engine loads them from the directory
# named by LBUG_EXTENSION_VERSION in its CMakeLists.txt (0.21.2 -> "0.21.0").
# Bump this, the committed Cargo.lock, and the vendored extensions together.
lbug = "=0.21.2"
# Additional dependencies for thread safety and error handling
thiserror = "2.0"
once_cell = "1.20"
parking_lot = "0.12"
# dlopen flag constants for promote_self_to_global_scope (values differ per OS)
libc = "0.2"

# Note: do not enable LTO. Fat LTO internalizes the lbug C++ engine symbols,
# so they are not exported from the NIF cdylib — and Ladybug extensions
# (vector, fts, llm, ...) resolve engine symbols from the host process at
# dlopen time. LTO breaks all extension loading.

[profile.release]
# Explicit: see the note above. Fat LTO strips the engine symbols the
# extensions dlopen against. Keep thin/fat LTO off for every profile.
lto = false
